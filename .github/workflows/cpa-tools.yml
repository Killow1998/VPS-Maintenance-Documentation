name: CPA tools
on:
  pull_request:
    paths: ['scripts/cpa/**', 'cpa.sh', 'cpa.ps1', '.github/workflows/cpa-tools.yml']
  push:
    paths: ['scripts/cpa/**', 'cpa.sh', 'cpa.ps1', '.github/workflows/cpa-tools.yml']
permissions:
  contents: read
jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty==2.0.15
      - run: python -B -m unittest discover -s scripts/cpa -p "test_quota_*.py" -v
      - if: runner.os == 'Linux'
        run: |
          python -B -m unittest discover -s scripts/cpa/cpa-admin -p 'test_*.py' -v
          python -B -m unittest discover -s scripts/cpa/cpa-observer -p 'test_observer.py' -v
          python -B -m unittest discover -s scripts/cpa/cpa-tools -p 'test_*.py' -v
