log_format xboard_sub_safe '$remote_addr [$time_local] "$request_method" '
                           '$status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=xboard_sub:10m rate=60r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/xboard-subscribe.access.log xboard_sub_safe;
    error_log /var/log/nginx/xboard-subscribe.error.log warn;
    limit_req_status 429;
    add_header Cache-Control "private, no-store" always;

    location ^~ /api/v1/client/ {
        limit_req zone=xboard_sub burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /s/ {
        limit_req zone=xboard_sub burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
